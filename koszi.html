<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Köszönjük · Nyugodt vacsorák</title><meta name="description" content="Hat hét a család heti vacsoráinak megtervezéséhez, menükkel, bevásárlólistákkal és dietetikusi segítséggel."><style data-csak-onallo>body{margin:0}</style><style>
.lp{--lp-szin-fo:#6B8F71;--lp-szin-sotet:#3E4A40;--lp-szin-alap:#fffaf2;--lp-barack:#F2B58C;--lp-halvany:#e8eee5;--lp-betu-cim:Georgia,serif;--lp-betu-szoveg:'Segoe UI',Arial,sans-serif;background:var(--lp-szin-alap);color:var(--lp-szin-sotet);font:17px/1.65 var(--lp-betu-szoveg);overflow:clip}
.lp *,.lp *::before,.lp *::after{box-sizing:border-box}
.lp img{max-width:100%;display:block;height:auto}
.lp .wrap{width:min(1160px,calc(100% - 40px));margin:auto}
.lp header,.lp footer{padding:20px 0}
.lp header img{width:245px}
.lp section{padding:clamp(50px,8vw,100px) 0}
.lp h1,.lp h2{font-family:var(--lp-betu-cim);font-weight:400;line-height:1.08;letter-spacing:-.035em;margin:0 0 22px;text-wrap:balance}
.lp h1{font-size:clamp(36px,5vw,66px)}
.lp h2{font-size:clamp(32px,4vw,49px)}
.lp h3{font-size:19px;line-height:1.32;margin:0 0 10px}
.lp p{margin:0 0 15px}
.lp .kicker{font-size:13px;font-weight:700;letter-spacing:.045em;margin:0 0 15px}
.lp .lead{font-size:18px}
.lp .btn{display:inline-block;border-radius:8px;background:var(--lp-szin-sotet);color:white;text-decoration:none;padding:13px 21px;font-weight:650;font-size:15px;margin-top:12px}
.lp a:focus-visible,.lp summary:focus-visible{outline:3px solid #a64b3c;outline-offset:5px}
.lp .hero{padding-top:20px;background:var(--lp-halvany)}
.lp .hero-copy{padding:28px;background:var(--lp-szin-alap);border-radius:22px;position:relative;z-index:1;margin:0 0 22px}
.lp .photo{width:100%;border-radius:24px;object-fit:cover}
.lp .vacsora{aspect-ratio:16/10;object-position:70% center}
.lp .dora{aspect-ratio:4/3;object-position:center 44%}
.lp .split{display:grid;gap:30px;align-items:center}
.lp .cards{display:grid;gap:16px;margin:25px 0 0}
.lp .card{background:var(--lp-szin-alap);color:var(--lp-szin-sotet);padding:23px;border:1px solid #c7d3c7;border-radius:16px}
.lp .card p:last-child{margin-bottom:0}
.lp .card .icon{margin:0 0 13px;width:32px}
.lp .green{background:var(--lp-halvany)}
.lp .dark{background:var(--lp-szin-sotet);color:var(--lp-szin-alap)}
.lp .dark .btn{background:var(--lp-szin-sotet);color:white;border:1px solid #fffaf2}
.lp .peach{background:#fae1cf}
.lp .measure{max-width:760px}
.lp .center{text-align:center;margin-inline:auto}
.lp .price{font:clamp(28px,3vw,42px) var(--lp-betu-cim)}
.lp .compare{display:grid;gap:16px;margin:28px 0}
.lp .compare article:last-child{background:var(--lp-halvany)}
.lp blockquote{margin:0 0 18px}
.lp .menu{border-collapse:collapse;width:100%;background:var(--lp-szin-alap);border-radius:12px;overflow:hidden}
.lp .menu caption{text-align:left;font-weight:700;padding:0 0 12px}
.lp .menu th,.lp .menu td{padding:9px 14px;text-align:left;border-bottom:1px solid #d8e0d5}
.lp .menu th{background:var(--lp-halvany)}
.lp .faq{max-width:850px;margin:auto}
.lp details{border-top:1px solid #aebcaf;padding:16px 0}
.lp summary{cursor:pointer;font-weight:650}
.lp details p{margin:12px 0 0}
.lp .fine{font-size:14px}
.lp .notice{padding:17px 20px;border:1px solid currentColor;border-radius:12px;margin-top:20px}
.lp .intro-note{font-size:13px;margin:0;padding:7px 20px;text-align:center;background:var(--lp-halvany)}
.lp .bonus{margin-top:26px}
.lp .bonus img{max-height:290px}
.lp footer a,.lp .notice a{color:inherit}
.lp #jelentkezes{scroll-margin-top:20px}
@media(min-width:760px){
 .lp .split{grid-template-columns:1fr 1fr;gap:54px}
 .lp .hero .split{grid-template-columns:1fr 1.12fr;gap:0}
 .lp .hero-copy{margin:0 -50px 0 0;padding:clamp(30px,4vw,58px)}
 .lp .hero .vacsora{min-height:580px;aspect-ratio:1/1}
 .lp .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
 .lp .split .cards{grid-template-columns:1fr}
 .lp .compare{grid-template-columns:1fr 1fr}
 .lp .portrait .photo{order:-1}
}
</style></head><body><div class="lp"><main><section><div class="wrap measure"><h1>Köszönjük az érdeklődésed!</h1><p>A Nyugodt vacsorák program részleteit az oldalon találod.</p><a class="btn" href="index.html">Vissza a programhoz</a></div></section></main></div></body></html>
